<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction - Payment</title>
    <!-- Link to the Tailwind CSS CDN for quick setup -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Add a simple animation for the loading text */
        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .5;
            }
        }

        .animate-pulse-slow {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Header with consistent navigation -->
    <header class="bg-gray-900 text-white shadow-lg w-full">
        <div class="container mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between">
            <h1 class="text-3xl font-bold mb-4 sm:mb-0">Cineverse</h1>
            <button id="logoutBtn"
                class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-6 rounded-full transition duration-300 transform hover:scale-105 mt-4 sm:mt-0">
                Logout
            </button>
        </div>
        <!-- Navbar -->
        <div class="bg-gray-800 text-white shadow-md w-full">
            <nav class="container mx-auto px-4 py-2 flex items-center justify-center">
                <ul class="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-8 text-lg font-medium">
                    <li><a href="index.html" class="hover:text-gray-300 transition duration-300">Home</a></li>
                    <li><a href="homepage.html" class="hover:text-gray-300 transition duration-300">Dashboard</a></li>
                    <li><a href="movies.html" class="hover:text-gray-300 transition duration-300">Movies</a></li>
                    <li><a href="shows.html"
                            class="hover:text-gray-300 transition duration-300 border-b-2 border-indigo-600">Shows</a>
                    </li>
                    <li><a href="booking_history.html" class="hover:text-gray-300 transition duration-300">Booking
                            History</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="flex-grow">
        <div class="max-w-xl mx-auto my-6 p-6 sm:p-8 bg-white rounded-xl shadow-lg">
            <h2 class="text-2xl font-bold text-center mb-6">Payment</h2>
            <div class="space-y-4 mb-6 p-4 bg-gray-50 rounded-lg">
                <h3 class="text-lg font-semibold">Booking Summary</h3>
                <p class="text-sm sm:text-base"><strong>Movie:</strong> <span id="movieName"
                        class="font-normal text-gray-600">Loading...</span></p>
                <p class="text-sm sm:text-base"><strong>Showtime:</strong> <span id="showTime"
                        class="font-normal text-gray-600"></span></p>
                <p class="text-sm sm:text-base"><strong>Seats:</strong> <span id="seats"
                        class="font-normal text-gray-600"></span></p>
                <p class="text-sm sm:text-base"><strong>Total Price:</strong> ₹<span id="amount"
                        class="font-normal text-gray-600"></span></p>
            </div>

            <form id="paymentForm">
                <div class="space-y-4">
                    <div class="flex flex-col">
                        <label for="cardNumber" class="font-semibold text-sm">Card Number</label>
                        <input type="text" id="cardNumber"
                            class="mt-1 p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="1234 5678 9012 3456" required />
                    </div>
                    <div class="flex flex-col sm:flex-row sm:space-x-4">
                        <div class="form-group w-full">
                            <label for="expiryDate" class="font-semibold text-sm">Expiry Date</label>
                            <input type="text" id="expiryDate"
                                class="mt-1 p-3 w-full border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                placeholder="MM/YY" required />
                        </div>
                        <div class="form-group w-full mt-4 sm:mt-0">
                            <label for="cvv" class="font-semibold text-sm">CVV</label>
                            <input type="password" id="cvv"
                                class="mt-1 p-3 w-full border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                placeholder="***" required />
                        </div>
                    </div>
                </div>
                <button type="submit"
                    class="mt-6 w-full py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors duration-200">
                    Pay Now
                </button>
            </form>

            <!-- Message Box for Feedback -->
            <div id="messageBox" class="hidden mt-4 text-center p-3 rounded-lg shadow-md"></div>

            <div class="loading hidden mt-4 text-center text-sm text-gray-500 animate-pulse-slow" id="loading">
                Processing Payment...</div>
        </div>
    </main>

    <script>
        const token = sessionStorage.getItem("token");
        const role = sessionStorage.getItem("role");

        if (!token) {
            window.location.href = "login_animation.html"; // redirect if not logged in
        }

        const params = new URLSearchParams(window.location.search);
        const movieId = params.get("movieId");
        const time = params.get("time");

        const seats = JSON.parse(sessionStorage.getItem("selectedSeats")) || [];
        const totalPrice = sessionStorage.getItem("totalPrice");

        // Get references to summary elements
        const movieNameEl = document.getElementById("movieName");
        const showTimeEl = document.getElementById("showTime");
        const seatsEl = document.getElementById("seats");
        const amountEl = document.getElementById("amount");
        const loadingEl = document.getElementById("loading");
        const paymentForm = document.getElementById("paymentForm");
        const messageBox = document.getElementById("messageBox");

        showTimeEl.textContent = time;
        seatsEl.textContent = seats.join(", ");
        amountEl.textContent = totalPrice;

        // Fetch movie details by movieId
        fetch(`http://localhost:8080/api/movies/${movieId}`, {
            headers: { "Authorization": "Bearer " + token }
        })
            .then(res => res.json())
            .then(data => {
                movieNameEl.textContent = data.title;
            })
            .catch(error => {
                console.error("Error fetching movie details:", error);
                movieNameEl.textContent = "N/A";
            });

        // Function to show a message in the message box
        function showMessage(message, type) {
            messageBox.textContent = message;
            messageBox.classList.remove('hidden', 'bg-red-200', 'text-red-800', 'bg-green-200', 'text-green-800');
            if (type === 'success') {
                messageBox.classList.add('bg-green-200', 'text-green-800');
            } else {
                messageBox.classList.add('bg-red-200', 'text-red-800');
            }
        }

        // Logout
        document.getElementById("logoutBtn").addEventListener("click", () => {
            sessionStorage.clear(); // Clear all session data
            localStorage.clear(); // Clear all local storage data
            window.location.href = "/login.html";
        });

        // Fake Payment Process
        paymentForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            loadingEl.classList.remove("hidden");
            messageBox.classList.add('hidden');

            // Fake delay for processing
            setTimeout(async () => {
                try {
                    const response = await fetch("http://localhost:8080/api/bookings", {
                        method: "POST",
                        headers: {
                            "Authorization": "Bearer " + token,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            movieId: movieId,
                            time: time,
                            seats: seats,
                            amount: totalPrice,
                            paymentStatus: "SUCCESS"
                        })
                    });

                    loadingEl.classList.add("hidden");
                    if (!response.ok) throw new Error("Booking failed");

                    const data = await response.json();
                    window.location.href = `/confirmation.html?bookingId=${data.bookingId}`;

                } catch (err) {
                    loadingEl.classList.add("hidden");
                    showMessage("Payment Failed: " + err.message, 'error');
                }
            }, 2000);
        });
    </script>
</body>

</html>
