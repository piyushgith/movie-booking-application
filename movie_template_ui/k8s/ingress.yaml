apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: movie-ui-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Uncomment and adjust if using cert-manager for TLS
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    # - hosts:
    #     - example.com
    #   secretName: movie-ui-tls
  rules:
    - host: ""
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: movie-ui-service
                port:
                  number: 80
