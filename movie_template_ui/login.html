<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cineverse - Login</title>
    <!-- Use Tailwind CSS for a modern, responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center">

    <!-- Header, consistent with the welcome page -->
    <header class="bg-gray-900 text-white shadow-lg w-full fixed top-0 left-0 z-10">
        <div class="container mx-auto px-4 py-4">
            <h1 class="text-3xl font-bold">Cineverse</h1>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center w-full">
        <div class="bg-white p-8 sm:p-10 rounded-2xl shadow-2xl w-full max-w-sm mt-20">
            <h2 class="text-3xl font-bold text-gray-800 text-center mb-6">Login</h2>
            <form id="loginForm">
                <div class="mb-4">
                    <label for="username" class="block text-gray-700 font-medium mb-2">Email</label>
                    <input type="email" id="username" value="piyush@gmail.com" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-gray-700 font-medium mb-2">Password</label>
                    <input type="password" id="password" value="prasad" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <!-- "Remember me" checkbox -->
                <div class="mb-6 flex items-center">
                    <input type="checkbox" id="rememberMe" class="h-4 w-4 text-indigo-600 rounded-full border-gray-300 focus:ring-indigo-500">
                    <label for="rememberMe" class="ml-2 block text-sm text-gray-900">Remember me</label>
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-full transition duration-300 transform hover:scale-105">
                    Login
                </button>
                <div class="text-red-500 text-sm text-center mt-4 hidden" id="errorMsg">Invalid username or password</div>
            </form>
        </div>
    </main>

    <!-- Footer, consistent with the welcome page -->
    <footer class="bg-gray-900 text-white text-center py-6 w-full mt-auto">
        <p>&copy; 2025 Cineverse. All rights reserved.</p>
    </footer>

    <!-- Axios library for API calls -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');
        const rememberMeCheckbox = document.getElementById('rememberMe');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            loginBtn.disabled = true;

            const emailId = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const rememberMe = rememberMeCheckbox.checked;

            try {
                const response = await axios.post('http://localhost:8080/user/getToken', {
                    emailId,
                    password
                }, {
                    headers: { 'Content-Type': 'application/json' }
                });

                const { token, role } = response.data;

                // Here you would handle the 'remember me' logic, for example,
                // by storing the token in a different way or for a longer duration.
                // For this example, we'll just store it in sessionStorage.
                sessionStorage.setItem("token", token);
                sessionStorage.setItem("role", role);
                sessionStorage.setItem("rememberMe", rememberMe);

                if (role === "ADMIN") {
                    window.location.href = "/admin/admin-dashboard.html";
                    console.log("Admin logged in");
                } else {
                    window.location.href = "homepage.html";
                }
            } catch (error) {
                errorMsg.classList.remove('hidden');
                console.error('Login error:', error);
            } finally {
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
