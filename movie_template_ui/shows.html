<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cineverse - Shows</title>
    <!-- Use Tailwind CSS for a modern, responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Header with consistent navigation -->
    <header class="bg-gray-900 text-white shadow-lg w-full">
        <div class="container mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between">
            <h1 class="text-3xl font-bold mb-4 sm:mb-0">Cineverse</h1>
            <button id="logoutBtn"
                class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-6 rounded-full transition duration-300 transform hover:scale-105 mt-4 sm:mt-0">
                Logout
            </button>
        </div>
        <!-- Navbar -->
        <div class="bg-gray-800 text-white shadow-md w-full">
            <nav class="container mx-auto px-4 py-2 flex items-center justify-center">
                <ul class="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-8 text-lg font-medium">
                    <li><a href="index.html" class="hover:text-gray-300 transition duration-300">Home</a></li>
                    <li><a href="homepage.html" class="hover:text-gray-300 transition duration-300">Dashboard</a></li>
                    <li><a href="movies.html" class="hover:text-gray-300 transition duration-300">Movies</a></li>
                    <li><a href="shows.html" class="hover:text-gray-300 transition duration-300">Shows</a></li>
                    <li><a href="booking_history.html" class="hover:text-gray-300 transition duration-300">Booking
                            History</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8">
        <section class="text-center my-12 bg-white rounded-2xl shadow-xl p-8 max-w-4xl mx-auto">
            <h2 class="text-4xl font-extrabold text-gray-800 mb-4">Find Shows</h2>
            <p class="text-lg text-gray-600 leading-relaxed">
                Select your city to see available movies and showtimes.
            </p>
        </section>

        <!-- Location selection and search -->
        <div id="locationSearch"
            class="mb-6 flex flex-col sm:flex-row items-center space-y-4 sm:space-y-0 sm:space-x-4 justify-center">
            <label for="location" class="text-lg font-medium text-gray-700">Select Location:</label>
            <select id="location"
                class="px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="BANGALORE">Bangalore</option>
                <option value="MUMBAI">Mumbai</option>
                <option value="DELHI">Delhi</option>
            </select>
            <button id="loadShowsBtn"
                class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-full transition duration-300">
                Search
            </button>
        </div>

        <!-- Movie listings -->
        <div class="movies grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8" id="moviesList"></div>
        <div class="text-red-500 text-center mt-4 hidden" id="errorMsg">No shows available for this location.</div>
    </main>

    <!-- Footer, consistent with other pages -->
    <footer class="bg-gray-900 text-white text-center py-6 w-full mt-auto">
        <p>&copy; 2025 Cineverse. All rights reserved.</p>
    </footer>

    <script>
        const token = sessionStorage.getItem("token");
        const role = sessionStorage.getItem("role");

        if (!token) {
            window.location.href = "login_animation.html"; // redirect if not logged in
        }

        const logoutBtn = document.getElementById("logoutBtn");

        // Logout function
        logoutBtn.addEventListener("click", () => {
            sessionStorage.clear(); // Clear all session data
            localStorage.clear(); // Clear all local storage data
            window.location.href = "login_animation.html";
        });

        const locationSelect = document.getElementById("location");
        const moviesList = document.getElementById("moviesList");
        const errorMsg = document.getElementById("errorMsg");
        const loadShowsBtn = document.getElementById("loadShowsBtn");
        const locationSearchContainer = document.getElementById("locationSearch");

        /**
         * Displays a list of movie shows.
         * @param {Array<Object>} shows - An array of show objects to display.
         */
        function displayShows(shows) {
            moviesList.innerHTML = "";
            errorMsg.classList.add('hidden');

            if (!shows || shows.length === 0) {
                errorMsg.classList.remove('hidden');
                return;
            }

            shows.forEach(movie => {
                const card = document.createElement("div");
                card.classList.add("movie-card", "bg-white", "rounded-2xl", "shadow-lg", "overflow-hidden", "flex", "flex-col", "transition", "duration-300", "hover:shadow-2xl", "hover:scale-105", "transform");

                card.innerHTML = `
                    <img src="${movie.posterUrl}" alt="${movie.title}" class="w-full h-96 object-cover">
                    <div class="p-5 flex-grow">
                        <h3 class="font-bold text-xl text-gray-800 mb-2">${movie.title}</h3>
                        <p class="text-gray-600 text-sm mb-2"><strong>Theatre:</strong> ${movie.theatre}</p>
                        <div class="showtimes flex flex-wrap gap-2">
                            ${movie.timings.map(time =>
                    `<button class="showtime-btn px-3 py-1 bg-indigo-600 text-white text-xs font-medium rounded-full hover:bg-indigo-700 transition duration-300" data-id="${movie.id}" data-time="${time}">
                                ${time}
                            </button>`).join("")}
                        </div>
                    </div>
                `;
                moviesList.appendChild(card);
            });

            // Add event listeners to showtime buttons
            document.querySelectorAll(".showtime-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    const movieId = btn.getAttribute("data-id");
                    const time = btn.getAttribute("data-time");
                    window.location.href = `seats.html?movieId=${movieId}&time=${encodeURIComponent(time)}`;
                });
            });
        }

        /**
         * Fetches show data from a given API endpoint and displays it.
         * @param {string} url - The API endpoint to fetch data from.
         * @param {string} location - The location to filter shows by.
         */
        async function fetchAndDisplayShows(url, location) {
            moviesList.innerHTML = `<div class="col-span-full text-center text-lg text-gray-500">Loading shows...</div>`;
            errorMsg.classList.add('hidden');

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();
                const shows = data.locations ? data.locations[location.toUpperCase()] : [data];
                displayShows(shows);
            } catch (error) {
                errorMsg.textContent = "Error loading shows. Please try again later.";
                errorMsg.classList.remove('hidden');
            }
        }

        // Logic to determine which API to call
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('movieId');

        if (movieId) {
            // Case 2: Opened from movie page with a movieId
            locationSearchContainer.classList.add('hidden'); // Hide location dropdown and search button
            fetchAndDisplayShows(`http://localhost:8080/show/findShow/${movieId}`, locationSelect.value);
        } else {
            // Case 1: Opened from the navigation bar
            loadShowsBtn.addEventListener("click", () => {
                const location = locationSelect.value.toUpperCase();
                fetchAndDisplayShows(`http://localhost:8080/show/findShowByLocation/${location}`, location);
            });
            // Initial load for the default location
            const defaultLocation = locationSelect.value.toUpperCase();
            fetchAndDisplayShows(`http://localhost:8080/show/findShowByLocation/${defaultLocation}`, defaultLocation);
        }
    </script>
</body>

</html>
