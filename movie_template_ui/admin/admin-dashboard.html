<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">
  <header class="bg-gray-900 text-white shadow-lg w-full">
    <div class="container mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-3xl font-bold">Admin Dashboard</h1>
      <button id="logoutBtn"
        class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-6 rounded-full transition duration-300 transform hover:scale-105">
        Logout
      </button>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center p-6">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 w-full max-w-6xl">
      <!-- User Management Card -->
      <a href="admin-users.html"
        class="card bg-white p-8 rounded-xl shadow-lg transition-transform duration-300 cursor-pointer flex flex-col items-center text-center">
        <div class="text-4xl mb-4">👤</div>
        <h2 class="text-xl font-semibold text-gray-800">User Management</h2>
        <p class="text-gray-600 mt-2">Create, update, and manage user accounts and roles.</p>
      </a>

      <!-- Movie Management Card -->
      <a href="admin-movies.html"
        class="card bg-white p-8 rounded-xl shadow-lg transition-transform duration-300 cursor-pointer flex flex-col items-center text-center">
        <div class="text-4xl mb-4">🎥</div>
        <h2 class="text-xl font-semibold text-gray-800">Movie Management</h2>
        <p class="text-gray-600 mt-2">Add, edit, and delete movies from the catalog.</p>
      </a>

      <!-- Show Management Card -->
      <a href="admin-shows.html"
        class="card bg-white p-8 rounded-xl shadow-lg transition-transform duration-300 cursor-pointer flex flex-col items-center text-center">
        <div class="text-4xl mb-4">🎭</div>
        <h2 class="text-xl font-semibold text-gray-800">Show Management</h2>
        <p class="text-gray-600 mt-2">Manage movie showtimes, locations, and ticket prices.</p>
      </a>
    </div>
  </main>

  <script>
    const token = localStorage.getItem("token");
    if (!token) window.location.href = "/login.html";

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.clear();
      window.location.href = "/login.html";
    });
  </script>
</body>

</html>
