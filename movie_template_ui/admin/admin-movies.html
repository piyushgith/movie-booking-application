<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Movie Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Header and Navigation -->
  <header class="bg-gray-900 text-white shadow-lg w-full">
    <div class="container mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between">
      <h1 class="text-3xl font-bold mb-4 sm:mb-0">Cineverse Admin</h1>
      <button id="logoutBtn"
        class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-6 rounded-full transition duration-300 transform hover:scale-105 mt-4 sm:mt-0">
        Logout
      </button>
    </div>
    <div class="bg-gray-800 text-white shadow-md w-full">
      <nav class="container mx-auto px-4 py-2 flex items-center justify-center">
        <ul class="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-8 text-lg font-medium">
          <li><a href="admin-dashboard.html" class="hover:text-gray-300 transition duration-300">Dashboard</a></li>
          <li><a href="admin-users.html" class="hover:text-gray-300 transition duration-300">Users</a></li>
          <li><a href="admin-movies.html"
              class="hover:text-gray-300 transition duration-300 border-b-2 border-indigo-600">Movies</a></li>
          <li><a href="admin-shows.html" class="hover:text-gray-300 transition duration-300">Shows</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="flex-grow p-6 sm:p-10">
    <div class="max-w-7xl mx-auto space-y-8">
      <h2 class="text-3xl font-bold text-gray-800">🎬 Movie Management</h2>

      <!-- Create / Update Form -->
      <div class="bg-white p-6 rounded-xl shadow-md">
        <h3 class="text-xl font-semibold text-gray-800 mb-4">Create / Update Movie</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <input type="hidden" id="movieId">
          <input type="text" id="title" placeholder="Movie Title"
            class="p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <input type="text" id="genre" placeholder="Genre"
            class="p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <input type="text" id="language" placeholder="Language"
            class="p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <input type="number" id="duration" placeholder="Duration (mins)"
            class="p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <input type="text" id="posterUrl" placeholder="Poster URL"
            class="p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <button onclick="saveMovie()"
            class="col-span-1 md:col-span-2 lg:col-span-3 py-3 px-6 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors duration-200">
            💾 Save Movie
          </button>
        </div>
      </div>

      <!-- Movies Table -->
      <div class="bg-white p-6 rounded-xl shadow-md overflow-x-auto">
        <h3 class="text-xl font-semibold text-gray-800 mb-4">All Movies</h3>
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-green-600 text-white">
            <tr>
              <th scope="col" class="px-6 py-3 text-left text-sm font-medium">ID</th>
              <th scope="col" class="px-6 py-3 text-left text-sm font-medium">Poster</th>
              <th scope="col" class="px-6 py-3 text-left text-sm font-medium">Title</th>
              <th scope="col" class="px-6 py-3 text-left text-sm font-medium">Genre</th>
              <th scope="col" class="px-6 py-3 text-left text-sm font-medium">Language</th>
              <th scope="col" class="px-6 py-3 text-left text-sm font-medium">Duration</th>
              <th scope="col" class="px-6 py-3 text-left text-sm font-medium">Actions</th>
            </tr>
          </thead>
          <tbody id="movieTable" class="bg-white divide-y divide-gray-200">
            <!-- Movie rows will be dynamically added here -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const token = sessionStorage.getItem("token");
    if (!token) window.location.href = "/login_animation.html";

    function fetchMovies() {
      fetch("http://localhost:8080/api/admin/movies", {
        headers: { "Authorization": "Bearer " + token }
      })
        .then(res => res.json())
        .then(data => {
          const table = document.getElementById("movieTable");
          table.innerHTML = "";
          data.forEach(m => {
            const row = document.createElement("tr");
            row.innerHTML = `
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${m.id}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"><img src="${m.posterUrl}" alt="poster" class="w-10 h-14 object-cover rounded-md"></td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${m.title}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${m.genre}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${m.language}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${m.duration} mins</td>
            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
              <button onclick="editMovie(${m.id}, '${m.title}', '${m.genre}', '${m.language}', ${m.duration}, '${m.posterUrl}')" class="text-indigo-600 hover:text-indigo-900">✏ Edit</button>
              <button onclick="deleteMovie(${m.id})" class="text-red-600 hover:text-red-900 ml-2">🗑 Delete</button>
            </td>
          `;
            table.appendChild(row);
          });
        });
    }

    function saveMovie() {
      const id = document.getElementById("movieId").value;
      const movie = {
        title: document.getElementById("title").value,
        genre: document.getElementById("genre").value,
        language: document.getElementById("language").value,
        duration: document.getElementById("duration").value,
        posterUrl: document.getElementById("posterUrl").value
      };
      let url = "http://localhost:8080/api/admin/movies";
      let method = "POST";
      if (id) { url += "/" + id; method = "PUT"; }

      fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify(movie)
      }).then(() => { fetchMovies(); resetForm(); });
    }

    function editMovie(id, title, genre, language, duration, posterUrl) {
      document.getElementById("movieId").value = id;
      document.getElementById("title").value = title;
      document.getElementById("genre").value = genre;
      document.getElementById("language").value = language;
      document.getElementById("duration").value = duration;
      document.getElementById("posterUrl").value = posterUrl;
    }

    function deleteMovie(id) {
      fetch("http://localhost:8080/api/admin/movies/" + id, {
        method: "DELETE",
        headers: { "Authorization": "Bearer " + token }
      }).then(() => fetchMovies());
    }

    function resetForm() {
      document.getElementById("movieId").value = "";
      document.getElementById("title").value = "";
      document.getElementById("genre").value = "";
      document.getElementById("language").value = "";
      document.getElementById("duration").value = "";
      document.getElementById("posterUrl").value = "";
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
      sessionStorage.clear(); // Clear all session data
      localStorage.clear(); // Clear all local storage data
      window.location.href = "/login_animation.html";
    });

    fetchMovies();
  </script>
</body>

</html>
