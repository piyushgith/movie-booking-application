<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Listings</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Basic table styling for a clean look */
        .styled-table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
        }

        .styled-table thead tr {
            background-color: #1a202c;
            color: #ffffff;
            text-align: left;
            border-radius: 12px 12px 0 0;
        }

        .styled-table th,
        .styled-table td {
            padding: 1rem 1.25rem;
            text-align: left;
        }

        .styled-table tbody tr:nth-child(even) {
            background-color: #f7fafc;
        }

        .styled-table tbody tr:hover {
            background-color: #edf2f7;
            transition-duration: 300ms;
        }

        .styled-table tbody tr td:first-child {
            border-top-left-radius: 0.5rem;
            border-bottom-left-radius: 0.5rem;
        }

        .styled-table tbody tr td:last-child {
            border-top-right-radius: 0.5rem;
            border-bottom-right-radius: 0.5rem;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #fff;
            padding: 2rem;
            border-radius: 12px;
            max-width: 90%;
            max-height: 90%;
            overflow-y: auto;
            position: relative;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center">

    <!-- Header with consistent navigation -->
    <header class="bg-gray-900 text-white shadow-lg w-full">
        <div class="container mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between">
            <h1 class="text-3xl font-bold mb-4 sm:mb-0">Cineverse</h1>
            <button id="logoutBtn"
                class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-6 rounded-full transition duration-300 transform hover:scale-105 mt-4 sm:mt-0">
                Logout
            </button>
        </div>
        <!-- Navbar -->
        <div class="bg-gray-800 text-white shadow-md w-full">
            <nav class="container mx-auto px-4 py-2 flex items-center justify-center">
                <ul class="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-8 text-lg font-medium">
                    <li><a href="index.html" class="hover:text-gray-300 transition duration-300">Home</a></li>
                    <li><a href="homepage.html" class="hover:text-gray-300 transition duration-300">Dashboard</a></li>
                    <li><a href="movies.html" class="hover:text-gray-300 transition duration-300">Movies</a></li>
                    <li><a href="shows.html" class="hover:text-gray-300 transition duration-300">Shows</a></li>
                    <li><a href="booking_history.html" class="hover:text-gray-300 transition duration-300">Booking
                            History</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-7xl mx-auto px-4 py-8">
        <!-- Movie Table Section -->
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="styled-table w-full">
                    <thead>
                        <tr>
                            <th class="rounded-tl-lg">ID</th>
                            <th>Movie Name</th>
                            <th>Poster</th>
                            <th>Duration</th>
                            <th>Genre</th>
                            <th>Language</th>
                            <th>Rating</th>
                            <th>Release Date</th>
                            <th class="rounded-tr-lg">Action</th>
                        </tr>
                    </thead>
                    <tbody id="movieTableBody">
                        <!-- Table rows will be inserted here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- JSON Modal -->
    <div id="jsonModal" class="modal">
        <div class="modal-content relative w-full max-w-lg mx-4">
            <button id="closeModalBtn"
                class="absolute top-2 right-2 text-gray-500 hover:text-gray-900 transition-colors duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <h2 class="text-2xl font-bold mb-4 text-center text-gray-900">Movie Details (JSON)</h2>
            <pre id="jsonOutput" class="bg-gray-100 p-4 rounded-xl text-sm overflow-auto max-h-96"></pre>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const token = sessionStorage.getItem("token");
        const role = sessionStorage.getItem("role");

        if (!token) {
            window.location.href = "login_animation.html"; // redirect if not logged in
        }

        // Logout function
        logoutBtn.addEventListener("click", () => {
            sessionStorage.clear(); // Clear all session data
            localStorage.clear(); // Clear all local storage data
            window.location.href = "login_animation.html";
        });

        // Replace the movies constant declaration and DOMContentLoaded event listener with:

        let movies = [];

        async function loadMovies() {
            try {
                const response = await axios.get('http://localhost:8080/movies/findAllMovies', {
                    headers: { 'Content-Type': 'application/json' }
                });
                movies = response.data;
                renderMovies();
            } catch (error) {
                console.error('Error fetching movies:', error);
            }
        }

        function renderMovies() {
            const movieTableBody = document.getElementById("movieTableBody");
            movieTableBody.innerHTML = ''; // Clear existing content

            movies.forEach(movie => {
                const row = document.createElement("tr");
                row.classList.add("hover:bg-gray-50", "transition-colors", "duration-200", "rounded-xl");
                row.innerHTML = `
                    <td class="p-3 md:p-4">${movie.id}</td>
                    <td class="p-3 md:p-4 font-semibold text-gray-800">${movie.movieName}</td>
                    <td class="p-3 md:p-4"><img src="${movie.movieImage}" alt="${movie.movieName} Poster" class="w-16 h-auto rounded-lg shadow"></td>
                    <td class="p-3 md:p-4">${movie.duration}</td>
                    <td class="p-3 md:p-4">${movie.genre}</td>
                    <td class="p-3 md:p-4">${movie.language}</td>
                    <td class="p-3 md:p-4"><span class="bg-yellow-400 text-yellow-900 text-xs font-bold px-2 py-1 rounded-full">${movie.rating}</span></td>
                    <td class="p-3 md:p-4">${movie.releaseDate}</td>
                    <td class="p-3 md:p-4">
                        <button class="shows-btn bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-full transition-colors duration-200 shadow-md transform hover:scale-105" data-movie='${JSON.stringify(movie)}'>
                            Shows
                        </button>
                    </td>
                `;
                movieTableBody.appendChild(row);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            const jsonModal = document.getElementById("jsonModal");
            const jsonOutput = document.getElementById("jsonOutput");
            const closeModalBtn = document.getElementById("closeModalBtn");

            // Load movies when page loads
            loadMovies();

            // Event delegation for the "Shows" buttons
            document.getElementById("movieTableBody").addEventListener("click", (event) => {
                const button = event.target.closest(".shows-btn");
                if (button) {
                    const movieData = JSON.parse(button.dataset.movie);
                    const movieDataForDisplay = { ...movieData };
                    delete movieDataForDisplay.movieImage;
                    jsonOutput.textContent = JSON.stringify(movieDataForDisplay, null, 2);
                    jsonModal.style.display = "flex";
                }
            });

            // Close modal handlers
            closeModalBtn.addEventListener("click", () => {
                jsonModal.style.display = "none";
            });

            window.addEventListener("click", (event) => {
                if (event.target === jsonModal) {
                    jsonModal.style.display = "none";
                }
            });
        });
    </script>
</body>

</html>
