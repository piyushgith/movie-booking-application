<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking History</title>
  <!-- Use Tailwind CSS for a modern, responsive design -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Header with consistent navigation -->
  <header class="bg-gray-900 text-white shadow-lg w-full">
    <div class="container mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between">
      <h1 class="text-3xl font-bold mb-4 sm:mb-0">Cineverse</h1>
      <button id="logoutBtn"
        class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-6 rounded-full transition duration-300 transform hover:scale-105 mt-4 sm:mt-0">
        Logout
      </button>
    </div>
    <!-- Navbar -->
    <div class="bg-gray-800 text-white shadow-md w-full">
      <nav class="container mx-auto px-4 py-2 flex items-center justify-center">
        <ul class="flex flex-col sm:flex-row space-y-2 sm:space-y-0 sm:space-x-8 text-lg font-medium">
          <li><a href="index.html" class="hover:text-gray-300 transition duration-300">Home</a></li>
          <li><a href="homepage.html" class="hover:text-gray-300 transition duration-300">Dashboard</a></li>
          <li><a href="movies.html" class="hover:text-gray-300 transition duration-300">Movies</a></li>
          <li><a href="shows.html" class="hover:text-gray-300 transition duration-300">Shows</a></li>
          <li><a href="booking_history.html" class="hover:text-gray-300 transition duration-300">Booking History</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="flex-grow">
    <div class="max-w-4xl mx-auto my-6 p-4 sm:p-8">
      <h2 class="text-2xl font-semibold text-center mb-6">🎫 Your Booking History</h2>
      <div class="bg-white rounded-xl shadow-lg p-4 sm:p-8">
        <div class="overflow-x-auto">
          <table class="w-full text-sm sm:text-base border-collapse">
            <thead>
              <tr>
                <th class="p-3 sm:p-4 bg-gray-800 text-white rounded-t-lg font-medium">Transaction ID</th>
                <th class="p-3 sm:p-4 bg-gray-800 text-white font-medium">Movie</th>
                <th class="p-3 sm:p-4 bg-gray-800 text-white font-medium">Show Time</th>
                <th class="p-3 sm:p-4 bg-gray-800 text-white font-medium">Seats</th>
                <th class="p-3 sm:p-4 bg-gray-800 text-white font-medium">Booking Date</th>
              </tr>
            </thead>
            <tbody id="bookingTable">
              <!-- Bookings will load here -->
            </tbody>
          </table>
        </div>
      </div>

      <a class="inline-block mt-6 px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-full transition duration-300 transform hover:scale-105"
        href="homepage.html">
        ⬅ Back to Dashboard
      </a>
    </div>
  </main>

  <script>
    const token = sessionStorage.getItem("token");
    if (!token) window.location.href = "/login_animation.html";

    async function loadBookings() {
      try {
        const response = await fetch("/api/user/bookings", {
          method: "GET",
          headers: { "Authorization": "Bearer " + token }
        });
        const bookings = await response.json();

        const table = document.getElementById("bookingTable");
        table.innerHTML = "";

        if (bookings.length === 0) {
          table.innerHTML = `<tr><td class="p-4 text-center border-b border-gray-200" colspan="5">No bookings found</td></tr>`;
        } else {
          bookings.forEach(b => {
            const row = `<tr class="hover:bg-gray-50">
              <td class="p-3 sm:p-4 border-b border-gray-200">${b.transactionId}</td>
              <td class="p-3 sm:p-4 border-b border-gray-200">${b.movieTitle}</td>
              <td class="p-3 sm:p-4 border-b border-gray-200">${b.showTime}</td>
              <td class="p-3 sm:p-4 border-b border-gray-200">${b.seats.join(", ")}</td>
              <td class="p-3 sm:p-4 border-b border-gray-200">${new Date(b.bookingDate).toLocaleDateString()}</td>
            </tr>`;
            table.innerHTML += row;
          });
        }
      } catch (error) {
        console.error("Error fetching bookings:", error);
      }
    }

    // Add logout functionality
    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.clear(); // Clear all session data
      localStorage.clear(); // Clear all local storage data
      window.location.href = '/login_animation.html';
    });

    loadBookings();
  </script>
</body>

</html>
