version: '3.8'

services:
  movie-booking-app:
    image: movie-booking-app
    container_name: movie-booking-prod
    ports:
      - "4000:4000"
    env_file:
      - .env.prod
    volumes:
      - movie-prod-data:/app/data
    environment:
      - SPRING_H2_CONSOLE_ENABLED=false
      - LOGGING_LEVEL_ROOT=INFO
    restart: unless-stopped

volumes:
  movie-prod-data: